name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test
        # Engram targets Java 11 bytecode but the build is verified on 17, the
        # lowest JDK with broad toolchain support, and on 21.
        run: ./gradlew build --console=plain

      - name: Verify the runnable jar works
        run: |
          ./gradlew :engram-replay:fatJar --console=plain
          java -jar engram-replay/build/libs/engram-replay-*-all.jar --help

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engram-replay-jar
          path: engram-replay/build/libs/*-all.jar
          if-no-files-found: warn
