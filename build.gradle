// Engram — root build.
//
// Shared configuration for every module. Individual modules add their own
// plugins and dependencies; cross-cutting settings (Java level, test framework,
// publishing metadata) live here so they cannot drift between modules.

plugins {
    id 'base'
    // The Central Portal aggregation is a publication on the root project, so
    // the root needs the signing plugin in order to sign it. Maven Central
    // requires a signature for every artifact *and* for module metadata.
    id 'signing'
    // The Central Portal aggregation lives on the root, so the root publishes too.
    id 'maven-publish'
}

// Signing credentials, resolved before subprojects {} is evaluated so the
// closure is in scope inside it. Absent on a normal local build, where signing
// is simply skipped and only `publishToMavenLocal` is used.
ext.signingKey = { findProperty('signing.key') ?: System.getenv('SIGNING_KEY') }
ext.signingPassphrase = { findProperty('signing.password') ?: System.getenv('SIGNING_PASSWORD') }

repositories {
    // The root project needs its own repository declaration even though it
    // publishes no code of its own: NMCP's own check task resolves
    // `com.gradleup.nmcp:nmcp-tasks` through the root's configurations, and
    // without this the publish fails at nmcpCheckAggregationFiles with
    // "no repositories are defined" before uploading anything.
    mavenCentral()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = project.property('group')
    version = project.property('version')

    // Each module's own publication needs signatures too, not just the root
    // aggregation's metadata.
    signing {
        def key = rootProject.ext.signingKey()
        def passphrase = rootProject.ext.signingPassphrase()
        if (key && passphrase) {
            useInMemoryPgpKeys(key, passphrase)
            // sign(publications) rather than signAllPublications(): Gradle's
            // SigningExtension has no signAllPublications method, and signing
            // the whole container covers every publication including the
            // Central Portal aggregation.
            sign project.publishing.publications
        }
    }

    repositories {
        mavenCentral()
    }

    java {
        // Matches Synapse's target so the recorder drops into an existing
        // FTC team project without bytecode-level surprises.
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // `release` pins the API surface to Java 11 even when building with a
        // newer JDK, so accidental use of newer APIs fails at compile time.
        options.release = 11
        options.compilerArgs << '-Xlint:all' << '-Xlint:-processing' << '-Xlint:-serial'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
            showStandardStreams = false
        }
        // Recording tests touch the filesystem and spawn writer threads;
        // keep them serial so failures are reproducible.
        maxParallelForks = 1
    }

    tasks.named('jar') {
        manifest {
            attributes(
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor': 'Aarav Labs'
            )
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    description = project.description ?: 'Engram — record and replay Synapse topic traffic.'
                    url = 'https://github.com/IamCoder18/engram'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    scm {
                        url = 'https://github.com/IamCoder18/engram'
                        connection = 'scm:git:git://github.com/IamCoder18/engram.git'
                        developerConnection = 'scm:git:ssh://git@github.com/IamCoder18/engram.git'
                    }
                    developers {
                        developer {
                            id = 'IamCoder18'
                            name = 'IamCoder18'
                        }
                    }
                }
            }
        }
        repositories {
            mavenLocal()
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/IamCoder18/engram'
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_USER') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

// Sign every publication on the root, which includes the Central Portal
// aggregation. Naming a single publication would sign that one and let Central
// reject the release for the unsigned remainder.
signing {
    def key = signingKey()
    def passphrase = signingPassphrase()
    if (key && passphrase) {
        useInMemoryPgpKeys(key, passphrase)
        sign project.publishing.publications
    }
}
