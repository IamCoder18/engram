org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ---- Engram coordinates -----------------------------------------------------
group=com.aaravlabs
version=0.1.0

# ---- Dependency versions ----------------------------------------------------
# Pinned here so every module resolves the same versions.
protobufVersion=3.25.5
protobufPluginVersion=0.9.4
junitVersion=5.10.2
junitPlatformVersion=1.10.2

# ---- Synapse compatibility --------------------------------------------------
# Minimum Synapse version Engram's recorder compiles against.
#
# Synapse 0.4.0 does not yet expose Orchestrator#addPublishListener, so the
# recorder falls back to its decorator strategy and cannot capture bulkRead
# sensor publishes. Once a Synapse release ships that hook, bump this and the
# recorder switches to the listener strategy automatically -- no code change.
synapseVersion=0.4.0

# ---- FTC SDK (compile-time only) --------------------------------------------
# Provided by the Robot Controller app at runtime. Needed on the compile
# classpath because EngramOpMode extends Synapse's SafeOpMode, which extends
# the SDK's OpMode.
ftcSdkVersion=10.2.0
